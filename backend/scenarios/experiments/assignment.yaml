# Task assignment strategies under a coordinated planner and heavy, skewed demand.
# capacity: 2 only affects the batching assigner (the others plan one task per trip).
name: assignment
description: Greedy vs Hungarian vs CP-SAT vs OR-Tools batching (prioritized planning).
planners: [prioritized]
assigners: [greedy, hungarian, cpsat, batching]
robots: [10, 20]
seeds: 10
ticks: 3000
warmup_ticks: 300
task_rate_per_robot: 0.022
base:
  capacity: 2
  zipf_s: 1.0
  pick_ticks: 2
  drop_ticks: 1
